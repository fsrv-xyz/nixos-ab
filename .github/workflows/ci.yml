name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: actionlint
        run: nix run --inputs-from ./tests nixpkgs#actionlint
      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nix run --inputs-from ./tests nixpkgs#nixfmt -- --check
      - name: deadnix
        run: nix run --inputs-from ./tests nixpkgs#deadnix -- --fail .
      - name: Go
        working-directory: ab-update
        shell: nix shell --inputs-from ../tests nixpkgs#go --command bash -e {0}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Evaluate checks
        run: nix flake check ./tests --no-build

  vm-test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ab, tang]
    steps:
      # four test images with their intermediate images and update artifacts outgrow the free disk
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          ls -l /dev/kvm
          test -w /dev/kvm
      # nixpkgs' image builder runs unshare --map-root-user, which Ubuntu's AppArmor default denies
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: VM test
        run: nix build ./tests#checks.x86_64-linux.${{ matrix.check }} -L
